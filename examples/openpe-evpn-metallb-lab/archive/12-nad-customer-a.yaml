# Multus NAD: macvlan on OpenPE-managed host bridge br-hs-1101
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: customer-a-macvlan
  namespace: customer-a
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "br-hs-1101",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "0.0.0.0/0", "gw": "172.16.1.1" }
        ]
      }
    }
