apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: customer-b-macvlan
  namespace: customer-b
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "br-hs-1102",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "0.0.0.0/0", "gw": "172.16.2.1" }
        ]
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: customer-b-pod-w0
  namespace: customer-b
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "customer-b-macvlan",
        "namespace": "customer-b",
        "ips": ["172.16.2.10/24"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker0
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/sh
        - -c
        - ip r del default dev eth0 || true; sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
---
apiVersion: v1
kind: Pod
metadata:
  name: customer-b-pod-w1
  namespace: customer-b
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "customer-b-macvlan",
        "namespace": "customer-b",
        "ips": ["172.16.2.11/24"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker1
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/sh
        - -c
        - ip r del default dev eth0 || true; sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
