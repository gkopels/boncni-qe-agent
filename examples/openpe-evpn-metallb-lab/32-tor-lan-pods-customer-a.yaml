# "External site" pods on ToR LAN (host bridge br-tor-a → VXLAN 1101 → OpenPE)
# Must schedule on worker0 where frr-tor creates br-tor-a.
apiVersion: v1
kind: Namespace
metadata:
  name: tor-lan-a
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: tor-lan-a-macvlan
  namespace: tor-lan-a
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "br-tor-a",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "0.0.0.0/0", "gw": "172.16.1.1" }
        ]
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: tor-lan-a-pod1
  namespace: tor-lan-a
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "tor-lan-a-macvlan",
        "namespace": "tor-lan-a",
        "ips": ["172.16.1.50/24"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker0
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/sh
        - -c
        - ip r del default dev eth0 || true; sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
---
apiVersion: v1
kind: Pod
metadata:
  name: tor-lan-a-pod2
  namespace: tor-lan-a
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "tor-lan-a-macvlan",
        "namespace": "tor-lan-a",
        "ips": ["172.16.1.51/24"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker0
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/sh
        - -c
        - ip r del default dev eth0 || true; sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
