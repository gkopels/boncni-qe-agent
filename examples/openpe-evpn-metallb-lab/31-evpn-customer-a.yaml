# OpenPE EVPN tenant customer-a (L3 VRF + L2 LAN) — Multus on br-hs-1101
apiVersion: network.openperouter.io/v1alpha1
kind: L3VNI
metadata:
  name: customer-a
  namespace: openshift-openperouter
spec:
  vni: 1001
  vrf: customer-a
  underlayAddressFamily: IPv4
  importRTs:
    - "64514:1001"
  exportRTs:
    - "64514:1001"
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
  hostSession:
    asn: 64514
    hostASN: 64515
    localCIDR:
      ipv4: 172.16.20.0/24
---
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: customer-a-l2
  namespace: openshift-openperouter
spec:
  vni: 1101
  underlayAddressFamily: IPv4
  gatewayIPs:
    - 172.16.1.1/24
  routingDomain:
    type: L3VNI
    l3vni:
      name: customer-a
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      lifecycle: Managed
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: customer-a-macvlan
  namespace: customer-a
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "br-hs-1101",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "0.0.0.0/0", "gw": "172.16.1.1" }
        ]
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: customer-a-l2-w0
  namespace: customer-a
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "customer-a-macvlan",
        "namespace": "customer-a",
        "ips": ["172.16.1.10/24"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker0
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/sh
        - -c
        - ip r del default dev eth0 || true; sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
---
apiVersion: v1
kind: Pod
metadata:
  name: customer-a-l2-w1
  namespace: customer-a
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "customer-a-macvlan",
        "namespace": "customer-a",
        "ips": ["172.16.1.11/24"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker1
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/sh
        - -c
        - ip r del default dev eth0 || true; sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
