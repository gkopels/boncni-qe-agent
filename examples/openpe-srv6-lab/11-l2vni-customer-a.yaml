# L2 overlay attached to L3VPN customer-a (east-west + dual-stack IRB toward SRv6 VRF)
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: customer-a-l2
  namespace: openshift-openperouter
spec:
  vni: 1101
  underlayAddressFamily: IPv4
  gatewayIPs:
    - 172.16.1.1/24
    - 2001:db8:1::1/64
  routingDomain:
    type: L3VPN
    l3vpn:
      name: customer-a
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      lifecycle: Managed
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: customer-a-macvlan
  namespace: customer-a
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "br-hs-1101",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "0.0.0.0/0", "gw": "172.16.1.1" },
          { "dst": "::/0", "gw": "2001:db8:1::1" }
        ]
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: customer-a-l2-w0
  namespace: customer-a
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "customer-a-macvlan",
        "namespace": "customer-a",
        "ips": ["172.16.1.10/24", "2001:db8:1::10/64"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker0
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/bash
        - -lc
        - |
          ip r del default dev eth0 || true
          ip -6 r del default dev eth0 || true
          # eth0 RAs often beat Multus static ::/0; pin default to L2 IRB
          ip -6 r replace default via 2001:db8:1::1 dev net1 || true
          sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
---
apiVersion: v1
kind: Pod
metadata:
  name: customer-a-l2-w1
  namespace: customer-a
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "customer-a-macvlan",
        "namespace": "customer-a",
        "ips": ["172.16.1.11/24", "2001:db8:1::11/64"]
      }]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker1
  containers:
    - name: net
      image: quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
      command:
        - /bin/bash
        - -lc
        - |
          ip r del default dev eth0 || true
          ip -6 r del default dev eth0 || true
          ip -6 r replace default via 2001:db8:1::1 dev net1 || true
          sleep infinity
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
